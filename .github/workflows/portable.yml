name: NeeView Mac migration checks
on:
  push:
    paths: ['portable/**', '.github/workflows/portable.yml']
  pull_request:
    paths: ['portable/**', '.github/workflows/portable.yml']
permissions:
  contents: read
jobs:
  p1:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # 正式视图/后端源码在测试中直接编译；不增加 Preview 产品入口。
      - run: python3 portable/scripts/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neeview-mac-p1
          path: |
            portable/acceptance/p1-validation.json
            portable/acceptance/p1-layout.png
            portable/tests/NeeView.Engine.Tests/TestResults/engine.trx
